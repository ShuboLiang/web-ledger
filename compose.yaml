name: qing-zhang

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 256mb
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: qingzhang
      POSTGRES_USER: qingzhang
      POSTGRES_PASSWORD: lsb19970624
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    image: qing-zhang-web:2.0.0
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "3218:3218"
    environment:
      TZ: Asia/Shanghai
      PORT: 3218
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://qingzhang:lsb19970624@postgres:5432/qingzhang
      DATA_DIR: /app/data
      INITIAL_LEDGER_PATH: /app/seed/initial-ledger.json
      # 直接使用 http://IP:3218 时保持 0；经 HTTPS 反向代理后改为 1。
      COOKIE_SECURE: 0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Pi SDK 生成的模型文件等运行数据，直接保存在宿主机目录中。
      - type: bind
        source: ./data
        target: /app/data

  # 一次性备份工具：docker compose run --rm backup
  # 输出 PostgreSQL 自定义格式备份到宿主机 ./backups（可通过环境变量修改）。
  backup:
    image: postgres:17-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: qingzhang
      POSTGRES_USER: qingzhang
      PGPASSWORD: lsb19970624
    volumes:
      - type: bind
        source: ./backups
        target: /backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        umask 077;
        target="/backups/qing-zhang-$$(date +%Y%m%d-%H%M%S).dump";
        pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc -f "$$target";
        echo "Backup created: $$target"

# PostgreSQL 数据现在直接保存在本地 ./pgdata 目录中（bind mount）。
